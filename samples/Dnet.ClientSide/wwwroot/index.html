<!DOCTYPE html>
<html data-dnet-theme="dark" lang="es-ES">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dnet Blazor</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="_content/Dnet.App.Shared/css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="_content/Dnet.App.Shared/bootstrap/bootstrap-icons/bootstrap-icons.css" />
    <link href="_content/Dnet.Blazor/dnet-blazor-styles.css" rel="stylesheet" />
    <link href="_content/Dnet.Blazor/styles/theme/dark.css" rel="stylesheet" />
    <link href="_content/Dnet.Blazor/styles/theme/compact.css" rel="stylesheet" />
    <link href="_content/Dnet.Blazor/styles/theme/high-contrast.css" rel="stylesheet" />
    <link href="_content/Dnet.Blazor/styles/theme/modern.css" rel="stylesheet" />
    <link href="_content/Dnet.Blazor/styles/theme/liquid-glass.css" rel="stylesheet" />
    <link href="_content/Dnet.Blazor/styles/theme/liquid-glass-dark.css" rel="stylesheet" />
    <link href="_content/Dnet.App.Shared/css/site.css" rel="stylesheet" />
    <link href="Dnet.App.ClientSide.styles.css" rel="stylesheet" />
    <script>
        (() => {
            // A shared link carries ?theme= and ?lang=; they win over the
            // saved preferences and become them, so the app opens as it was
            // shared and the layout keeps the URL in step from then on.
            try {
                const params = new URLSearchParams(location.search);
                const urlTheme = params.get("theme");
                const theme = urlTheme === "light" ? "" : urlTheme;
                if (["", "dark", "compact", "high-contrast", "modern", "liquid-glass", "liquid-glass-dark"].includes(theme)) {
                    localStorage.setItem("dnet.theme", JSON.stringify(theme));
                }
                const language = { es: "es-ES", "es-es": "es-ES", en: "en-US", "en-us": "en-US" }[(params.get("lang") ?? "").toLowerCase()];
                if (language) {
                    localStorage.setItem("dnet.language", JSON.stringify(language));
                }
            } catch {
                // A link that cannot be read or saved opens with the saved preferences.
            }
        })();
        (() => {
            try {
                const persistedTheme = JSON.parse(localStorage.getItem("dnet.theme") ?? "null");
                const theme = ["", "dark", "compact", "high-contrast", "modern", "liquid-glass", "liquid-glass-dark"].includes(persistedTheme)
                    ? persistedTheme
                    : "dark";
                document.documentElement.dataset.dnetTheme = theme;
            } catch {
                // An invalid preference must not prevent the application from loading.
            }
        })();
    </script>
</head>

<body>
    <div id="app">Cargando…</div>
    <script>
        (() => {
            try {
                const language = JSON.parse(localStorage.getItem("dnet.language") ?? '"es-ES"');
                const english = typeof language === "string" && language.startsWith("en");
                document.documentElement.lang = english ? "en-US" : "es-ES";
                document.getElementById("app").textContent = english ? "Loading…" : "Cargando…";
            } catch {
                // Keep the default language when the saved preference is invalid.
            }
        })();
    </script>

    <!-- Blazor runtime and Dnet.Blazor bundle -->
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Dnet.Blazor/rxjs.min.js"></script>
    <script src="_content/Dnet.Blazor/dnet-blazor.js"></script>
</body>

</html>

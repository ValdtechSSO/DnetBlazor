name: Publish NuGet package
run-name: Publish Dnet.Blazor ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example, 5.0.3 or 5.0.3-rc.1)"
        required: true
        type: string

concurrency:
  group: nuget-publish
  cancel-in-progress: false

env:
  NODE_VERSION: "22.x"
  PROJECT_PATH: "src/Dnet.Blazor/Dnet.Blazor.csproj"
  PACKAGE_OUTPUT: "artifacts/nuget"

jobs:
  build-and-publish:
    name: Build, test and publish
    runs-on: ubuntu-24.04
    environment: nuget
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve package version
        id: version
        env:
          LC_ALL: C
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$REQUESTED_VERSION"
          fi

          number='(0|[1-9][0-9]*)'
          label="($number|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
          release_version="^$number\.$number\.$number(-$label(\.$label)*)?$"
          if [[ ! "$VERSION" =~ $release_version ]]; then
            echo "Version must use X.Y.Z or X.Y.Z-prerelease without the v prefix."
            exit 1
          fi

          printf 'value=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend assets
        run: npm run buildDnetBlazor

      - name: Build agent reference
        run: node tools/build-reference.mjs

      - name: Verify agent reference matches the release version
        id: reference
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          EXPECTED="artifacts/dnet-blazor-agent-reference-$VERSION.zip"
          if [[ ! -f "$EXPECTED" ]]; then
            echo "::error::Expected $EXPECTED. Generator produced:"
            ls -1 artifacts/*.zip || true
            echo "::error::The version in README.md probably doesn't match the tag."
            exit 1
          fi
          echo "path=$EXPECTED" >> "$GITHUB_OUTPUT"

      - name: Restore solution
        run: dotnet restore DnetBlazorComponents.sln

      - name: Build solution
        run: dotnet build DnetBlazorComponents.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Install Chromium for browser regression tests
        run: tests/Dnet.Blazor.BrowserTests/install-playwright.sh --with-deps chromium

      - name: Test solution
        run: bash tests/Dnet.Blazor.BrowserTests/run-with-sample.sh

      - name: Pack NuGet package
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: >-
          dotnet pack "$PROJECT_PATH" --configuration Release --no-build --no-restore
          --output "$PACKAGE_OUTPUT"
          -p:PackageVersion="$VERSION"
          -p:ContinuousIntegrationBuild=true

      - name: Validate package
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          PACKAGE_PATH="$PACKAGE_OUTPUT/Dnet.Blazor.$VERSION.nupkg"
          if [[ ! -f "$PACKAGE_PATH" ]]; then
            echo "The expected package was not created at $PACKAGE_PATH."
            exit 1
          fi

          package_contents="$(unzip -Z1 "$PACKAGE_PATH")"
          grep -Fxq "staticwebassets/dnet-blazor.js" <<< "$package_contents"
          grep -Fxq "staticwebassets/dnet-blazor-styles.css" <<< "$package_contents"

          echo "path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dnet.Blazor.${{ steps.version.outputs.value }}
          path: ${{ steps.package.outputs.path }}
          retention-days: 90

      - name: Authenticate with NuGet.org using OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package to NuGet.org
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "$PACKAGE_PATH"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Attach agent reference to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          files: ${{ steps.reference.outputs.path }}
          fail_on_unmatched_files: true

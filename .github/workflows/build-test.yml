name: Build and test

on:
  pull_request:
  push:
    branches:
      - main
      - Feature_*

env:
  DOTNET_VERSION: 10.0.x

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Build frontend assets
        run: |
          npm ci --ignore-scripts
          npm run buildDnetBlazor
      - name: Restore
        run: dotnet restore DnetBlazorComponents.sln
      - name: Build
        run: dotnet build DnetBlazorComponents.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test DnetBlazorComponents.sln --configuration Release --no-build --no-restore --verbosity normal

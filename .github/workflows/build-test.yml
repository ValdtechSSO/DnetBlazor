name: Build and test

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Optional test filter for diagnosing a failure; leave empty for the full suite"
        required: false
        type: string
      visual_scenario:
        description: "Optional visual scenario for diagnostics (for example, tooltip); leave empty for all"
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
      - Feature_*

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Build frontend assets
        run: |
          npm ci --ignore-scripts
          npm run lint:css
          npm run buildDnetBlazor
      - name: Check agent reference is up to date
        run: |
          node tools/build-reference.mjs --no-zip
          git diff --exit-code docs/ai/reference \
            || (echo "::error::docs/ai/reference is stale. Run: node tools/build-reference.mjs" && exit 1)
      - name: Restore
        run: dotnet restore DnetBlazorComponents.sln
      - name: Build
        run: dotnet build DnetBlazorComponents.sln --configuration Release --no-restore
      - name: Validate public package API
        run: dotnet pack src/Dnet.Blazor/Dnet.Blazor.csproj --configuration Release --no-build --no-restore --output artifacts/api-validation
      - name: Install Chromium for PickList browser regression
        run: tests/Dnet.Blazor.BrowserTests/install-playwright.sh --with-deps chromium
      - name: Test
        run: |
          test_args=()
          if [ -n "$DNET_TEST_FILTER" ]; then
            test_args+=(--filter "$DNET_TEST_FILTER")
          fi
          bash tests/Dnet.Blazor.BrowserTests/run-with-sample.sh --logger trx --results-directory artifacts/ci-results "${test_args[@]}"
        env:
          DNET_TEST_FILTER: ${{ inputs.test_filter || '' }}
          DNET_VISUAL_SCENARIO: ${{ inputs.visual_scenario || '' }}
      - name: Preserve test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.run_id }}
          path: |
            artifacts/ci-results/
            tests/Dnet.Blazor.BrowserTests/VisualBaseline/goldens/linux/*.actual.png
            /tmp/dnetblazor-sample.log
          retention-days: 7
          if-no-files-found: ignore

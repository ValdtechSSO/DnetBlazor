name: deploy-blazor-components
run-name: Build and Deploy Version ${{ github.run_number }} by @${{ github.actor }}

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: valdtechsso/dnetblazor

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile.kestrel
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Remote Server
    needs: build-and-push
    runs-on: ubuntu-latest
    # Selecting a ref in Run workflow is an explicit deployment request.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read

    env:
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_REMOTE_HOST }}
          username: ${{ secrets.SSH_REMOTE_USER }}
          password: ${{ secrets.SSH_REMOTE_PASSWORD }}
          port: ${{ secrets.SSH_REMOTE_PORT }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_DIGEST
          script: |
            set -eu
            cd /home/docker
            export DNETBLAZOR_IMAGE="ghcr.io/valdtechsso/dnetblazor@${IMAGE_DIGEST}"
            printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            docker compose -f dnetblazor-docker-compose.yaml stop
            docker container prune -f
            docker image prune -f
            docker pull "$DNETBLAZOR_IMAGE"
            docker compose -f dnetblazor-docker-compose.yaml up -d
            docker logout ghcr.io

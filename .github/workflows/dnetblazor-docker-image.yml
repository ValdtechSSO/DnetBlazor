name: deploy-blazor-components
run-name: Build and Deploy Version ${{ github.run_number }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Inspect the application network and port without changing services
        type: boolean
        default: false
      worker_recovery:
        description: Restore the authorized soccer worker network and start the validated release
        type: choice
        default: none
        options:
          - none
          - reserve
          - preview
          - apply
          - finish

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: valdtechsso/dnetblazor

jobs:
  worker-recovery:
    if: ${{ inputs.worker_recovery != 'none' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Copy reviewed recovery tools
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_REMOTE_HOST }}
          username: ${{ secrets.SSH_REMOTE_USER }}
          password: ${{ secrets.SSH_REMOTE_PASSWORD }}
          port: ${{ secrets.SSH_REMOTE_PORT }}
          source: tools/deployment-repair/recover_soccer_worker.py,tools/deployment-repair/finish_soccer_recovery.py,tools/deployment-repair/reserve_soccer_worker_ip.py,tools/deployment-repair/allocate_proxy_ips.py,tools/deployment-repair/network-reservations.baseline.json
          target: /tmp/dnet-soccer-recovery-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Revalidate and recover only the soccer worker
        uses: appleboy/ssh-action@v1.2.5
        env:
          RECOVERY_MODE: ${{ inputs.worker_recovery }}
        with:
          host: ${{ secrets.SSH_REMOTE_HOST }}
          username: ${{ secrets.SSH_REMOTE_USER }}
          password: ${{ secrets.SSH_REMOTE_PASSWORD }}
          port: ${{ secrets.SSH_REMOTE_PORT }}
          envs: RECOVERY_MODE
          script: |
            set -eu
            work=/tmp/dnet-soccer-recovery-${{ github.run_id }}-${{ github.run_attempt }}
            trap 'rm -rf "$work"' EXIT
            cd "$work/tools/deployment-repair"
            case "$RECOVERY_MODE" in
              reserve) python3 reserve_soccer_worker_ip.py ;;
              preview) python3 recover_soccer_worker.py --baseline network-reservations.baseline.json ;;
              apply) python3 recover_soccer_worker.py --baseline network-reservations.baseline.json --apply ;;
              finish) python3 finish_soccer_recovery.py ;;
              *) exit 1 ;;
            esac

  diagnostics:
    if: ${{ inputs.diagnostics_only }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Inspect application network and port
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_REMOTE_HOST }}
          username: ${{ secrets.SSH_REMOTE_USER }}
          password: ${{ secrets.SSH_REMOTE_PASSWORD }}
          port: ${{ secrets.SSH_REMOTE_PORT }}
          script: |
            set -eu
            cd /home/docker
            container_id="$(docker compose -f dnetblazor-docker-compose.yaml ps -aq blazorclient)"
            if [ -n "$container_id" ]; then
              docker inspect --format 'App: {{.Name}} state={{.State.Status}} error={{.State.Error}} image={{.Config.Image}}' "$container_id"
              docker logs --tail 20 "$container_id"
            fi
            docker ps -a --filter publish=5001 --format 'Port owner: {{.ID}} {{.Names}} {{.Ports}} {{.Status}}'
            for network_id in $(docker network ls --filter label=com.docker.compose.project=docker --filter label=com.docker.compose.network=datalnet --format '{{.ID}}'); do
              docker network inspect --format '{{range .Containers}}{{if eq .IPv4Address "192.168.0.3/24"}}IP owner: {{.Name}} {{.IPv4Address}}{{end}}{{end}}' "$network_id"
            done
            ss -ltn '( sport = :5001 )' || true
            python3 - <<'PY'
            import copy, http.client, json, subprocess
            def query(*args): return json.loads(subprocess.check_output(args, text=True))
            worker=query('docker','inspect','soccer-integration-worker-prod')[0]
            image=query('docker','image','inspect',worker['Config']['Image'])[0]
            original='/home/docker/.proxy-recovery-backups/20261017T144744Z-462764/worker.compose.original'
            before=query('docker','compose','-p','docker','--project-directory','/home/docker','-f',original,'config','--format','json')
            service=before['services']['soccerintegrationworkerprod']
            parse=lambda values:dict(value.split('=',1) for value in values or [])
            expected=parse(image['Config'].get('Env'));expected.update(service.get('environment') or {})
            current=parse(worker['Config'].get('Env'))
            print(json.dumps({'worker_running':worker['State']['Running'],'worker_ip':worker['NetworkSettings']['Networks']['docker_datalnet']['IPAddress'],'image_unchanged':worker['Image']==image['Id'],'environment_values_unchanged':current==expected,'restart_count':worker['RestartCount']}))
            for name,host,port in [('soccer-mng','192.168.0.27',5002),('soccer-public','192.168.0.28',5007)]:
              connection=http.client.HTTPConnection(host,port,timeout=5)
              try:
                connection.request('GET','/swagger/v1/swagger.json');response=connection.getresponse()
                print(json.dumps({'api':name,'http_status':response.status}))
              finally: connection.close()
            PY
            docker inspect --format 'Proxy image={{.Config.Image}} mounts={{range .Mounts}}{{.Source}} -> {{.Destination}}; {{end}}' docker-webproxy-1
            docker exec docker-webproxy-1 sh -c 'ls -1 /app/appsettings*.json'
            docker exec docker-webproxy-1 cat /app/appsettings.Production.json | python3 -c '
            import json, sys
            data=json.load(sys.stdin)
            proxy=data.get("ReverseProxy", {})
            routes=proxy.get("Routes", {})
            if isinstance(routes, list): routes={str(i):r for i,r in enumerate(routes)}
            selected={k:r for k,r in routes.items() if "datalnet.com" in json.dumps(r.get("Match", {}))}
            clusters={r["ClusterId"]:proxy.get("Clusters", {}).get(r["ClusterId"]) for r in selected.values()}
            print(json.dumps({"routes":selected,"clusters":clusters}))
            '

  build-and-push:
    if: ${{ !inputs.diagnostics_only && inputs.worker_recovery == 'none' }}
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile.kestrel
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Remote Server
    needs: build-and-push
    runs-on: ubuntu-latest
    # Selecting a ref in Run workflow is an explicit deployment request.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read

    env:
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
      SOURCE_COMMIT: ${{ github.sha }}
    
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Copy Docker Compose file to deployment host
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_REMOTE_HOST }}
          username: ${{ secrets.SSH_REMOTE_USER }}
          password: ${{ secrets.SSH_REMOTE_PASSWORD }}
          port: ${{ secrets.SSH_REMOTE_PORT }}
          source: dnetblazor-docker-compose.yaml
          target: /home/docker
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_REMOTE_HOST }}
          username: ${{ secrets.SSH_REMOTE_USER }}
          password: ${{ secrets.SSH_REMOTE_PASSWORD }}
          port: ${{ secrets.SSH_REMOTE_PORT }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_DIGEST,SOURCE_COMMIT
          script: |
            set -eu
            cd /home/docker
            export DNETBLAZOR_IMAGE="ghcr.io/valdtechsso/dnetblazor@${IMAGE_DIGEST}"
            printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

            resolved_image="$(docker compose -f dnetblazor-docker-compose.yaml config --images)"
            if [ "$resolved_image" != "$DNETBLAZOR_IMAGE" ]; then
              echo "Compose resolved $resolved_image instead of $DNETBLAZOR_IMAGE"
              exit 1
            fi

            docker pull "$DNETBLAZOR_IMAGE"
            image_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$DNETBLAZOR_IMAGE")"
            if [ "$image_revision" != "$SOURCE_COMMIT" ]; then
              echo "Image revision $image_revision does not match workflow commit $SOURCE_COMMIT"
              exit 1
            fi

            docker compose -f dnetblazor-docker-compose.yaml up -d --force-recreate --pull never

            container_id="$(docker compose -f dnetblazor-docker-compose.yaml ps -q blazorclient)"
            running_image_id="$(docker inspect --format '{{.Image}}' "$container_id")"
            expected_image_id="$(docker image inspect --format '{{.Id}}' "$DNETBLAZOR_IMAGE")"
            if [ "$running_image_id" != "$expected_image_id" ]; then
              echo "Running container does not use the image built by this workflow"
              exit 1
            fi

            echo "Deployed commit $SOURCE_COMMIT using $DNETBLAZOR_IMAGE"
            docker container prune -f
            docker image prune -f
            docker logout ghcr.io
